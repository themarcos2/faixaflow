<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc"><title id="title">Três etapas do atendimento</title><desc id="desc">1. Foto no Gemini. 2. Lista no FaixaFlow. 3. Arquivos na pasta do cliente ou USB.</desc><g font-family="DejaVu Sans,Segoe UI,sans-serif"><rect width="1200" height="180" rx="20" fill="#f5f3fb"/>
<g fill="#6d45e8" font-size="16" font-weight="700"><text x="38" y="50">01</text><text x="438" y="50">02</text><text x="838" y="50">03</text></g><g fill="#272338" font-size="23" font-weight="700"><text x="38" y="90">Foto no Gemini</text><text x="438" y="90">Lista no FaixaFlow</text><text x="838" y="90">Arquivos organizados</text></g><g fill="#776e85" font-size="15"><text x="38" y="124">Leia o papel com o prompt da loja.</text><text x="438" y="124">Cole, escolha a qualidade e baixe.</text><text x="838" y="124">Na pasta do cliente ou no USB.</text></g><g stroke="#ddd5ef"><path d="M400 34v110M800 34v110"/></g></g></svg>
